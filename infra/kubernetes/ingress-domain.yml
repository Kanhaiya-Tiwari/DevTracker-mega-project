apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devtracker-ingress
  namespace: devtracker
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # Uncomment below for SSL/TLS with cert-manager
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  # Uncomment below for HTTPS
  # tls:
  # - hosts:
  #   - YOUR-DOMAIN-HERE.com
  #   secretName: devtracker-tls
  rules:
  - host: devtracker.buildwithkanha.shop # <-- REPLACE WITH YOUR DOMAIN
    http:
      paths:
      - path: /api/v1
        pathType: Prefix
        backend:
          service:
            name: devtracker-backend-service
            port:
              number: 8000
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: devtracker-backend-service
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: devtracker-frontend-service
            port:
              number: 80
---
