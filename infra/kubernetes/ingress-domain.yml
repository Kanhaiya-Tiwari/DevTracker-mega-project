apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devtracker-ingress
  namespace: devtracker
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: buildwithkanha.shop  # <--- Your domain
    http:
      paths:
      - path: /api/v1(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: devtracker-backend-service
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: devtracker-frontend-service
            port:
              number: 80
