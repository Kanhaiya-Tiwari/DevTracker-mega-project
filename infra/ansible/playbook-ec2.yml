---
- hosts: localhost
  become: true
  gather_facts: yes

  tasks:
    - name: Update system packages
      apt:
        update_cache: yes
        upgrade: yes

    - name: Install required packages
      apt:
        name:
          - curl
          - git
          - unzip
          - jq
        state: present

    - name: Install AWS CLI v2
      shell: |
        curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
        unzip -q awscliv2.zip
        ./aws/install --update
        rm -rf awscliv2.zip aws
      args:
        creates: /usr/local/bin/aws

    - name: Install kubectl
      shell: |
        curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
        install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
        rm kubectl
      args:
        creates: /usr/local/bin/kubectl

    - name: Install Helm
      shell: |
        curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm

    - name: Install Docker
      shell: |
        curl -fsSL https://get.docker.com -o get-docker.sh
        sh get-docker.sh
        usermod -aG docker ubuntu
      args:
        creates: /usr/bin/docker

    - name: Install k3s (lightweight Kubernetes)
      shell: |
        PUBLIC_IP=$(curl -s http://169.254.169.254/latest/meta-data/public-ipv4)
        if [ -n "$PUBLIC_IP" ]; then
            curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="server --tls-san $PUBLIC_IP" sh -
        else
            curl -sfL https://get.k3s.io | sh -
        fi
      args:
        creates: /usr/local/bin/k3s

    - name: Wait for k3s to be ready
      shell: |
        until kubectl get nodes 2>/dev/null; do
          echo "Waiting for k3s to start..."
          sleep 5
        done
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    - name: Verify k3s is running
      command: kubectl get nodes
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: k3s_status
      ignore_errors: yes

    - name: Display k3s status
      debug:
        var: k3s_status.stdout_lines

    - name: Install NGINX Ingress Controller (if not installed)
      shell: |
        kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.8.1/deploy/static/provider/cloud/deploy.yaml
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      when: k3s_status.rc == 0

    - name: Wait for Ingress Controller
      shell: |
        kubectl wait --namespace ingress-nginx \
          --for=condition=ready pod \
          --selector=app.kubernetes.io/component=controller \
          --timeout=300s
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      when: k3s_status.rc == 0

    - name: Get EC2 Public IP
      shell: curl -s http://169.254.169.254/latest/meta-data/public-ipv4
      register: ec2_public_ip
      ignore_errors: yes

    - name: Display EC2 Public IP
      debug:
        msg: "EC2 Public IP: {{ ec2_public_ip.stdout }}"

    - name: Setup kubectl for ubuntu user
      shell: |
        mkdir -p /home/ubuntu/.kube
        cp /etc/rancher/k3s/k3s.yaml /home/ubuntu/.kube/config
        chown -R ubuntu:ubuntu /home/ubuntu/.kube
        chmod 600 /home/ubuntu/.kube/config
        echo 'export KUBECONFIG=/home/ubuntu/.kube/config' >> /home/ubuntu/.bashrc

    - name: Build Docker images
      shell: |
        cd /home/ubuntu/DevTracker-mega-project/backend
        docker build -t devtracker-backend:latest .
        docker save devtracker-backend:latest -o /tmp/backend.tar
        cd /home/ubuntu/DevTracker-mega-project/frontend
        docker build -t devtracker-frontend:latest .
        docker save devtracker-frontend:latest -o /tmp/frontend.tar
      become_user: ubuntu

    - name: Load images into k3s
      shell: |
        k3s ctr images import /tmp/backend.tar
        k3s ctr images import /tmp/frontend.tar

    - name: Create DevTracker secrets
      shell: |
        kubectl create secret generic devtracker-secrets -n devtracker \
          --from-literal=postgres-user=devtrackr \
          --from-literal=postgres-password=devtrackr \
          --from-literal=JWT_SECRET=devtrackr_secret \
          --from-literal=DATABASE_URL="postgresql+asyncpg://devtrackr:devtrackr@postgres:5432/devtrackr" \
          --from-literal=REDIS_URL="redis://redis:6379/0" \
          --from-literal=OPENROUTER_API_KEY=your_key_here \
          --from-literal=OPENROUTER_MODEL="nvidia/nemotron-nano-9b-v2:free"
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      ignore_errors: yes

    - name: Deploy DevTracker Application
      shell: |
        cd /home/ubuntu/DevTracker-mega-project/infra/kubernetes
        kubectl apply -f namespace.yml
        kubectl apply -f configmap.yml
        kubectl apply -f postgres-statefulset.yml
        kubectl apply -f postgres-service.yml
        kubectl apply -f redis-statefulset.yml
        kubectl apply -f redis-service.yml
        kubectl apply -f backend-deployment.yml
        kubectl apply -f backend-service.yml
        kubectl apply -f frontend-deployment.yml
        kubectl apply -f frontend-service.yml
        kubectl apply -f nginx-configmap.yml
        kubectl apply -f ingress-domain.yml
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      become_user: ubuntu

    - name: Wait for Database Pods
      shell: |
        kubectl wait --for=condition=ready pod -l component=database -n devtracker --timeout=300s
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      ignore_errors: yes

    - name: Wait for Cache Pods
      shell: |
        kubectl wait --for=condition=ready pod -l component=cache -n devtracker --timeout=300s
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      ignore_errors: yes

    - name: Wait for Backend Pods
      shell: |
        kubectl wait --for=condition=ready pod -l component=backend -n devtracker --timeout=300s
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      ignore_errors: yes

    - name: Wait for Frontend Pods
      shell: |
        kubectl wait --for=condition=ready pod -l component=frontend -n devtracker --timeout=300s
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      ignore_errors: yes

    - name: Get Application Status
      shell: |
        kubectl get all -n devtracker
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      register: app_status

    - name: Display Application Status
      debug:
        var: app_status.stdout_lines

    - name: Display Access Information
      debug:
        msg: |
          =========================================
          DevTracker Deployment Complete!
          =========================================
          Access your application at:
          http://{{ ec2_public_ip.stdout }}
          
          Or using port-forward:
          kubectl port-forward svc/devtracker-frontend-service 8080:80 -n devtracker
          =========================================
    - name: Install ArgoCD
      shell: |
        kubectl create namespace argocd
        kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config

    - name: Install Prometheus & Grafana
      shell: |
        helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
        helm install monitoring prometheus-community/kube-prometheus-stack
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config